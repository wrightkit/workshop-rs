[package]
name = "workshop-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Canonical multi-locale Overwatch Workshop semantic core: catalog, parser, WIR, validation, emitter."
repository.workspace = true
autotests = false

[lints]
workspace = true

[dependencies]
aho-corasick = "1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
unicode-ident.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
# The default `resolve-http`/`cli` features pull reqwest and clap into the
# test graph; draft-2020-12 validation is all these tests need.
jsonschema = { version = "0.18", default-features = false, features = ["draft202012"] }
regex = "1"

[[test]]
name = "integration"
path = "tests/integration.rs"
