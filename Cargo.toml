[workspace]
members = ["crates/workshop-rs", "crates/workshop-rs-cli"]
resolver = "3"

[workspace.package]
version = "1.25.1"
edition = "2024"
rust-version = "1.88.0"
license = "MIT"
repository = "https://github.com/wrightkit/workshop-rs"
description = "The canonical multi-locale Overwatch Workshop semantic core."

[workspace.dependencies]
serde = "1"
serde_json = "1"
sha2 = "0.10"
unicode-ident = "1"
unicode-normalization = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
debug = 1
opt-level = 1

[profile.dev.package."*"]
debug = false

[profile.test]
debug = 1
opt-level = 1

[profile.test.package."*"]
debug = false

[profile.dist]
inherits = "release"
lto = "thin"
