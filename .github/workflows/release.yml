name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

# Serialized across all tag pushes so an older tag cannot publish while a
# newer release is in flight; the latest guard in github-release keeps a
# queued/re-run older tag from regressing the latest marker.
concurrency:
  group: workshop-rs-release
  cancel-in-progress: false

jobs:
  # The tag is the only release gate: it must name a commit of the default
  # branch whose workspace version equals the tag, and the same revision must
  # have passed CI before anything is published.
  release-gate:
    name: Release gate
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag identity
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          version="$(awk -F'"' '$1 ~ /^version = / { print $2; exit }' Cargo.toml)"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match workspace version $version" >&2
            exit 1
          fi
          relation="$(gh api "repos/$GITHUB_REPOSITORY/compare/$DEFAULT_BRANCH...$GITHUB_SHA" --jq '.status')"
          if [[ "$relation" != identical && "$relation" != behind ]]; then
            echo "tag $GITHUB_REF_NAME points to $GITHUB_SHA, which is not in $DEFAULT_BRANCH history ($relation)" >&2
            exit 1
          fi

      - name: Wait for release-revision CI
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_CHECK_RUNS: >-
            Rust (1.88.0) / Quality,
            Rust (stable) / Quality,
            Public API compatibility,
            Catalog check,
            WebAssembly build,
            five real-project scenarios,
            Workflow lint / Lint workflows
        run: |
          set -euo pipefail
          deadline=$(( SECONDS + 5400 ))
          pending=()
          IFS=',' read -r -a names <<< "$REQUIRED_CHECK_RUNS"
          for raw in "${names[@]}"; do
            name="$(echo "$raw" | xargs)"
            [ -n "$name" ] && pending+=("$name")
          done
          while [ "${#pending[@]}" -gt 0 ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              printf 'Timed out waiting for: %s\n' "${pending[@]}" >&2
              exit 1
            fi
            sleep 30
            keep=()
            for name in "${pending[@]}"; do
              if ! out="$(gh api --method GET "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
                -f "check_name=$name" \
                --jq '(.check_runs | sort_by(.id) | last) // {status: "missing", conclusion: ""} | "\(.status) \(.conclusion // "-")"' 2>&1)"; then
                echo "check-runs API call failed for '$name': $out" >&2
                exit 1
              fi
              status="${out%% *}"
              conclusion="${out#* }"
              if [ "$status" = completed ]; then
                # CI skips jobs that a commit's paths do not need; a skipped
                # check reports `skipped` and counts as passing.
                if [ "$conclusion" != success ] && [ "$conclusion" != skipped ]; then
                  echo "FAIL $name concluded '$conclusion'" >&2
                  exit 1
                fi
                echo "PASS $name"
              else
                echo "WAIT $name ($status)"
                keep+=("$name")
              fi
            done
            pending=("${keep[@]}")
          done

  publish-crates:
    name: Publish crates
    needs: release-gate
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: wrightkit/.github/.github/actions/setup-rust@main
        with:
          toolchain: stable

      - name: Verify publishable packages
        run: cargo publish --workspace --locked --dry-run

      - name: Publish workspace crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --locked

  build:
    name: Build (${{ matrix.target }})
    needs: release-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: wrightkit/.github/.github/actions/setup-rust@main
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --profile dist -p workshop-rs-cli --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BIN=workshop-rs-cli
          ARCHIVE="${BIN}-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          cp "target/${{ matrix.target }}/dist/${BIN}" "${BIN}"
          tar czf "${ARCHIVE}" "${BIN}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
          fi
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $BIN = "workshop-rs-cli"
          $ARCHIVE = "${BIN}-${{ github.ref_name }}-${{ matrix.target }}.zip"
          Copy-Item "target/${{ matrix.target }}/dist/${BIN}.exe" "${BIN}.exe"
          Compress-Archive -Path "${BIN}.exe" -DestinationPath $ARCHIVE
          $hash = (Get-FileHash $ARCHIVE -Algorithm SHA256).Hash.ToLower()
          "${hash}  ${ARCHIVE}" | Out-File -Encoding utf8 "${ARCHIVE}.sha256"
          echo "ARCHIVE=$ARCHIVE" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          retention-days: 1

  catalog-identity:
    name: Catalog identity
    needs: release-gate
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: wrightkit/.github/.github/actions/setup-rust@main
        with:
          toolchain: stable

      - name: Generate catalog-identity.json
        run: cargo run --locked -p workshop-rs-cli -- version --json > catalog-identity.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-catalog-identity
          path: catalog-identity.json
          retention-days: 1

  github-release:
    name: GitHub Release
    needs: [publish-crates, build, catalog-identity]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: artifacts/
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest="$(gh release view --json tagName --jq .tagName || true)"
          args=()
          if [[ -n "$latest" ]] && \
             [[ "$(printf '%s\n%s\n' "$latest" "${{ github.ref_name }}" | sort -V | tail -1)" != "${{ github.ref_name }}" ]]; then
            echo "tag ${{ github.ref_name }} is older than latest release $latest; not marking latest"
            args+=(--latest=false)
          fi
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            "${args[@]}" \
            artifacts/*
