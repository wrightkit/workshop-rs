name: Release artifacts

on:
  workflow_call:
    inputs:
      ref:
        description: Git revision containing the release packages
        required: true
        type: string
      tag:
        description: Canonical GitHub Release tag created by the release job
        required: true
        type: string
      commit:
        description: Release commit used in the release notes
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-artifacts-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-apple-darwin
            runner: macos-13
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install Linux cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build CLI
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: >-
          cargo build --locked --release -p workshop-rs-cli
          --target ${{ matrix.target }}

      - name: Package Unix artifact
        if: runner.os != 'Windows'
        env:
          VERSION: ${{ inputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          mkdir -p "dist/workshop-rs-cli-${version}-${TARGET}"
          cp "target/${TARGET}/release/workshop-rs-cli" \
            "dist/workshop-rs-cli-${version}-${TARGET}/"
          tar -C dist -czf \
            "dist/workshop-rs-cli-${version}-${TARGET}.tar.gz" \
            "workshop-rs-cli-${version}-${TARGET}"

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ inputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          $version = $env:VERSION.Substring(1)
          $directory = "workshop-rs-cli-$version-$env:TARGET"
          New-Item -ItemType Directory -Path "dist/$directory" | Out-Null
          $binary = "target/$env:TARGET/release/workshop-rs-cli.exe"
          Copy-Item $binary "dist/$directory/"
          Compress-Archive -Path "dist/$directory" `
            -DestinationPath "dist/workshop-rs-cli-$version-$env:TARGET.zip"

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  publish:
    name: Attach artifacts and publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums and catalog identity
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          cd ..
          cargo run --locked -p workshop-rs-cli -- version --json \
            > dist/catalog-identity.json

      - name: Verify the draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          release="$(gh release view "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json tagName,isDraft,isImmutable,url)"
          echo "${release}"
          test "$(jq -r .tagName <<<"${release}")" = "${TAG}"
          test "$(jq -r .isDraft <<<"${release}")" = "true"

      - name: Add catalog identity to release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          marker='<!-- workshop-rs-catalog-identity -->'
          body="$(gh release view "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" --json body --jq .body)"
          if [[ "${body}" != *"${marker}"* ]]; then
            {
              printf '%s\n\n' "${body}"
              printf '%s\n\n' "${marker}"
              printf '%s\n\n' '## Release identity'
              printf '%s\n\n' "- Revision: \`${COMMIT}\`"
              printf '%s\n' '### Catalog identity'
              printf '%s\n' '```json'
              cat dist/catalog-identity.json
              printf '%s\n' '```'
            } > release-notes.md
            gh release edit "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --notes-file release-notes.md
          fi

      - name: Upload artifacts and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: >-
          gh release upload "${TAG}" dist/* --clobber
          --repo "${GITHUB_REPOSITORY}"

      - name: Publish the completed GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: >-
          gh release edit "${TAG}" --draft=false
          --repo "${GITHUB_REPOSITORY}"
