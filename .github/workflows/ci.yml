name: CI

on:
  push:
    branches: ["main"]
  # Title and label events are deliberately absent. Branch protection reads a
  # required check from the newest check suite of the workflow that reports it,
  # so a metadata-only run of this workflow would hide the Rust results of the
  # code run on the same head. Checks that read the PR title or labels live in
  # public-api.yml.
  pull_request:
    types: [opened, synchronize, reopened]

env:
  CARGO_TERM_COLOR: always

# A newer push to the same pull request supersedes the older run.
# Pushes to main never share a group, so each main commit keeps a complete run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Skipped jobs still report their check names as passing, so a change that
  # touches only documentation does not leave a required check pending.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Check out repository
        if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'

  workflow-lint:
    name: Workflow lint
    uses: wrightkit/.github/.github/workflows/actionlint.yml@main

  check:
    name: Rust (${{ matrix.toolchain }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, 1.88.0]
    uses: wrightkit/.github/.github/workflows/rust-quality.yml@main
    with:
      toolchain: ${{ matrix.toolchain }}
      cache-shared-key: quality
      skip: ${{ needs.changes.outputs.code != 'true' }}

  # Consumer-side producer for the ubuntu/1.88.0/dev build identity
  # (`wrightkit/.github#126`): rust-quality stays artifact-free, so this job
  # builds the binary once and catalog-check downloads it instead of
  # recompiling the workspace.
  catalog-gen-build:
    name: Build catalog generator
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: wrightkit/.github/.github/actions/setup-rust@main
        with:
          toolchain: 1.88.0
          cache-shared-key: quality
      - name: Build catalog generator
        run: cargo build --locked -p workshop-rs --bin workshop-catalog-gen
      - name: Upload catalog generator artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workshop-catalog-gen-linux-1.88.0-debug
          path: target/debug/workshop-catalog-gen
          if-no-files-found: error

  catalog-check:
    name: Catalog check
    needs: catalog-gen-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download catalog generator artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: workshop-catalog-gen-linux-1.88.0-debug
          path: target/debug
      - name: Prepare catalog generator executable
        run: chmod +x target/debug/workshop-catalog-gen
      - name: Catalog check
        run: target/debug/workshop-catalog-gen check

  wasm-check:
    name: WebAssembly build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: wrightkit/.github/.github/actions/setup-rust@main
        with:
          toolchain: 1.88.0
          targets: wasm32-unknown-unknown
          cache-shared-key: quality
      - name: Check the parser and catalog library for WebAssembly
        run: cargo check --locked -p workshop-rs --lib --target wasm32-unknown-unknown

  # Deliberate re-execution: `check`'s `cargo test --workspace --all-targets`
  # covers the same pinned_real_projects filters, but this job isolates each
  # scenario into its own log, a machine-readable results.tsv, and a step
  # summary — per-scenario evidence and failure granularity a single
  # aggregated test run cannot show (#574).
  real-project-scenarios:
    name: five real-project scenarios
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: wrightkit/.github/.github/actions/setup-rust@main
        with:
          toolchain: stable
          cache-shared-key: quality
      - name: Run real-project scenarios and publish summary
        shell: bash
        run: |
          set -Eeuo pipefail

          artifact_dir="real-project-scenarios"
          mkdir -p "$artifact_dir"
          : > "$artifact_dir/all.log"
          : > "$artifact_dir/results.tsv"
          : > "$artifact_dir/summary.md"

          summary_path="${GITHUB_STEP_SUMMARY:-$artifact_dir/summary.md}"
          : > "$summary_path"

          write_summary() {
            printf '%s\n' "$1" >> "$summary_path"
            if [[ "$summary_path" != "$artifact_dir/summary.md" ]]; then
              printf '%s\n' "$1" >> "$artifact_dir/summary.md"
            fi
          }

          write_summary '## Real-project scenarios'
          write_summary ''
          write_summary '| Scenario | Status | Test result | Log |'
          write_summary '| --- | --- | --- | --- |'

          overall_status=0
          run_scenario() {
            scenario="$1"
            test_filter="$2"
            log_path="$artifact_dir/$scenario.log"

            set +e
            cargo test --locked -p workshop-rs --lib "$test_filter" -- --nocapture 2>&1 | tee "$log_path"
            scenario_status=${PIPESTATUS[0]}
            set -e

            result_line="$(grep -E '^test result:' "$log_path" | tail -1 || true)"
            if [[ "$scenario_status" -eq 0 ]]; then
              status='✅ PASS'
            else
              status='❌ FAIL'
              overall_status=1
            fi
            if [[ -z "$result_line" ]]; then
              result_line='no final test-result line'
            fi

            printf '%s\t%s\t%s\n' "$scenario" "$scenario_status" "$result_line" >> "$artifact_dir/results.tsv"
            write_summary "| \`$scenario\` | $status | \`$result_line\` | \`$scenario.log\` |"

            {
              printf '\n===== %s =====\n' "$scenario"
              cat "$log_path"
            } >> "$artifact_dir/all.log"
          }

          run_scenario parser tests::parser::pinned_real_projects
          run_scenario emitter tests::emitter::pinned_real_projects
          run_scenario locale tests::locale::pinned_real_projects

          write_summary ''
          write_summary "Detailed logs and machine-readable results are in the \`real-project-scenarios\` artifact."
          exit "$overall_status"
      - name: Upload scenario data for agents
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-project-scenarios
          path: real-project-scenarios/
