name: Release-plz

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]

env:
  CARGO_TERM_COLOR: always

jobs:
  release-pr:
    name: Maintain release PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.GH_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Run release-plz release-pr
        uses: >-
          MarcoIeni/release-plz-action@476794ede164c5137bfc3a1dc6ed3675275690f9
        with:
          command: release-pr
          version: "0.3.160"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

  release:
    name: Publish merged release PR
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'release-plz-') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: release
    outputs:
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
      release_tag: ${{ steps.release-identity.outputs.tag }}
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: release-plz-release-${{ github.event.pull_request.base.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout merged release
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.GH_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Run release gates
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace --all-targets
          cargo run --locked -p workshop-rs --bin workshop-catalog-gen -- \
            check
          cargo package --locked -p workshop-rs
          cargo package --locked -p workshop-rs-cli

      - name: Run release-plz release
        id: release-plz
        uses: >-
          MarcoIeni/release-plz-action@476794ede164c5137bfc3a1dc6ed3675275690f9
        with:
          command: release
          version: "0.3.160"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Export release identity
        id: release-identity
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          set -euo pipefail
          tag="$(
            jq -r '.[] | select(.package_name == "workshop-rs") | .tag' \
              <<<"${RELEASES}"
          )"
          [[ -n "${tag}" ]] || {
            echo 'release-plz did not return the workshop-rs release tag.' >&2
            exit 1
          }
          echo "tag=${tag}" >>"${GITHUB_OUTPUT}"

      - name: Ensure draft GitHub Release exists
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TAG: ${{ steps.release-identity.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --json isDraft,publishedAt >/dev/null 2>&1; then
            is_draft="$(gh release view "${TAG}" --json isDraft --jq .isDraft)"
            published_at="$(gh release view "${TAG}" --json publishedAt --jq .publishedAt)"
            if [[ "${is_draft}" == "true" && "${published_at}" == "null" ]]; then
              echo "draft GitHub Release ${TAG} already exists"
              exit 0
            fi
            echo "${TAG} exists but is not an unpublished draft." >&2
            exit 1
          fi
          gh release create "${TAG}" \
            --draft \
            --verify-tag \
            --title "${TAG}" \
            --generate-notes

  release-artifacts:
    name: Build and publish release artifacts
    needs: release
    if: needs.release.outputs.releases_created == 'true'
    uses: ./.github/workflows/release-artifacts.yml
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha }}
      tag: ${{ needs.release.outputs.release_tag }}
      commit: ${{ github.event.pull_request.merge_commit_sha }}
    permissions:
      contents: write
