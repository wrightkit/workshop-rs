name: Release-plz

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]

env:
  CARGO_TERM_COLOR: always

jobs:
  release-pr:
    name: Maintain release PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Run release-plz release-pr
        uses: >-
          MarcoIeni/release-plz-action@476794ede164c5137bfc3a1dc6ed3675275690f9
        with:
          command: release-pr
          version: "0.3.125"
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  release:
    name: Publish merged release PR
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'release-plz-') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: release-plz-release-${{ github.event.pull_request.base.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout merged release
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Run release gates
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace --all-targets
          cargo run --locked -p workshop-rs --bin workshop-catalog-gen -- \
            check
          cargo package --locked -p workshop-rs
          cargo package --locked -p workshop-rs-cli

      - name: Run release-plz release
        uses: >-
          MarcoIeni/release-plz-action@476794ede164c5137bfc3a1dc6ed3675275690f9
        with:
          command: release
          version: "0.3.125"
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
