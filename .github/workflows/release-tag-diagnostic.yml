name: Release tag diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/fix-release-state-handling'
    runs-on: ubuntu-latest
    steps:
      - name: Inspect complete tag namespace
        run: |
          set -euo pipefail
          git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git"
